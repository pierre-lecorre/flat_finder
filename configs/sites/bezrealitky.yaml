site_name: "bezrealitky"
source_type: "normal_listing_site"
enabled: true

# -----------------------------------------------------------------------
# Search URL — Prague rentals, max 20 000 CZK, apartments only
# -----------------------------------------------------------------------
start_urls:
  - "https://www.bezrealitky.cz/vyhledat?estateType=BYT&location=exact&offerType=PRONAJEM&osm_value=Hlavn%C3%AD+m%C4%9Bsto+Praha%2C+Praha%2C+%C4%8Cesko&priceTo=20000&regionOsmIds=R435514&currency=CZK"

search_url_templates:
  - "https://www.bezrealitky.cz/vyhledat?estateType=BYT&location=exact&offerType=PRONAJEM&osm_value=Hlavn%C3%AD+m%C4%9Bsto+Praha%2C+Praha%2C+%C4%8Cesko&priceTo=20000&regionOsmIds=R435514&currency=CZK&page={page}"

allowed_domains:
  - "bezrealitky.cz"
  - "bezrealitky.com"

# -----------------------------------------------------------------------
# Card detection
# -----------------------------------------------------------------------
listing_card_selector: "article.propertyCard"

# Two-phase mode: Phase 1 collects URLs, Phase 2 visits each detail page.
extraction_mode: "hybrid"

detail_page:
  enabled: true
  # Matches both .cz (/nemovitosti-byty-domy/...) and .com (/properties-flats-houses/...)
  # The scraper validates hrefs against a regex — this selector is the browser query.
  link_selector: "a[href*='/properties-flats-houses'], a[href*='/nemovitosti-byty-domy']"

# -----------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------
pagination:
  type: "page_param"
  max_pages: 5
  page_param_name: "page"
  start_page: 1

wait_rules:
  load_state: "domcontentloaded"
  wait_for_selector: "article.propertyCard"
  timeout_ms: 20000

# -----------------------------------------------------------------------
# Fields extracted from listing cards (used only in card_only mode)
# In hybrid/detail mode these are informational — actual extraction
# happens on the detail page via detail_fields below.
# -----------------------------------------------------------------------
fields:
  title:
    selector: "span[class*='propertyCardAddress']"
    attr: "text"
  price_text:
    selector: "span[class*='propertyPriceAmount']"
    attr: "text"
  price_additional:
    selector: "span[class*='propertyPriceAdditional']"
    attr: "text"
  price_per_meter:
    selector: "span[class*='propertyPricePerMeter']"
    attr: "text"
  listing_type:
    selector: "span[class*='offerCardLabel'], span[class*='propertyCardLabel']"
    attr: "text"
  listing_url:
    selector: "a[href*='/properties-flats-houses'], a[href*='/nemovitosti-byty-domy']"
    attr: "href"
  image_url:
    selector: "div[class*='propertyCardImageHolder'] img"
    attr: "src"

# -----------------------------------------------------------------------
# Fields extracted from each individual detail page (hybrid/detail mode)
# The scraper navigates directly to the listing URL so `driver` IS the
# detail page — selectors run on the full detail DOM.
# -----------------------------------------------------------------------
detail_fields:
  title:
    # e.g. "Flat to rent · 1+kk · 22 m\u00b2 · K Ov\u010d\u00ednu, Prague"
    selector: "h1, h2[class*='title'], div[class*='Title']"
    attr: "text"
  price_text:
    selector: "strong[class*='price'], span[class*='Price'], div[class*='price']"
    attr: "text"
  description:
    # Multiple known class fragments — tries all, uses first match
    selector: "div[class*='offerDetail'], div[class*='OfferDetail'], div[class*='description'], div[class*='Description']"
    attr: "text"
  image_url:
    selector: "div[class*='gallery'] img, div[class*='Gallery'] img, picture img"
    attr: "src"
  location:
    selector: "span[class*='address'], span[class*='Address'], div[class*='location']"
    attr: "text"
  external_id:
    # Parsed from URL in post-processing — no DOM selector needed
    selector: ""
    attr: ""

transforms:
  strip_query_params_from_url: true
  absolutize_urls: true
  clean_whitespace: true

filters:
  required_fields:
    - "listing_url"
  exclude_keywords: []

rate_limit:
  min_delay_ms: 1500
  max_delay_ms: 3000

browser:
  headless: true
  use_persistent_context: false
  storage_state_path: ""

notes: |
  Bezrealitky scraping strategy (two-phase):

  Phase 1 — URL collection:
    Visits each paginated search page (?page=N up to max_pages).
    Extracts all hrefs matching /properties-flats-houses/ or
    /nemovitosti-byty-domy/ as plain strings (no stale element risk).
    Deduplicates before phase 2.

  Phase 2 — Detail visits:
    Navigates to each collected URL in the same browser tab.
    Extracts all detail_fields from the fully-rendered page DOM.
    External ID is parsed from the URL path (e.g. /.../<id>-<slug>).

  Why two phases?
    In the old single-pass code, card WebDriver elements became stale
    immediately after the first detail-page navigation. All subsequent
    card reads returned empty/wrong data from the detail page DOM.

  Class name note:
    Bezrealitky uses Next.js with hashed CSS suffixes.
    All selectors use [class*='...'] partial matching.
