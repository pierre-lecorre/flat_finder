site_name: "bezrealitky"
source_type: "normal_listing_site"
enabled: true

# Search rentals in Prague
start_urls:
  - "https://www.bezrealitky.cz/vyhledat?advyhledat=1&nabidka=pronajem&typNemovitosti=byt&lokalita=praha"

search_url_templates:
  - "https://www.bezrealitky.cz/vyhledat?advyhledat=1&nabidka=pronajem&typNemovitosti=byt&lokalita=praha&page={page}"

allowed_domains:
  - "bezrealitky.cz"
  - "bezrealitky.com"

# Listing item card container
# Real selector from live HTML (Next.js app — classes contain hashed suffixes,
# but the stable semantic class is `propertyCard` present on every article card)
listing_card_selector: "article.propertyCard"

extraction_mode: "hybrid"

detail_page:
  enabled: true
  # Cards use /properties-flats-houses/... on .com and /nemovitosti-byty-domy/... on .cz
  # Both path fragments are matched here.
  link_selector: "a[href*='/properties-flats-houses'], a[href*='/nemovitosti-byty-domy']"

pagination:
  type: "page_param"
  max_pages: 5
  page_param_name: "page"
  start_page: 1

wait_rules:
  load_state: "domcontentloaded"
  # Use the stable partial class instead of the old non-existent `article.card`
  wait_for_selector: "article.propertyCard"
  timeout_ms: 20000

# Selectors on the search cards page
# Bezrealitky uses Next.js with hashed CSS class names.
# The pattern `[class*='...']` targets the stable readable fragment of each class.
fields:
  title:
    # Address line — e.g. "K Ovčínu, Prague - Kobylisy"
    selector: "span[class*='propertyCardAddress']"
    attr: "text"
  price_text:
    # Primary rent — e.g. "15,000 CZK"
    selector: "span[class*='propertyPriceAmount']"
    attr: "text"
  price_additional:
    # Service charges — e.g. "3,000 CZK"
    selector: "span[class*='propertyPriceAdditional']"
    attr: "text"
  price_per_meter:
    # Per-m² price — e.g. "682 CZK m²"
    selector: "span[class*='propertyPricePerMeter']"
    attr: "text"
  listing_type:
    # Label — e.g. "Apartment for rent" / "Flat to rent"
    selector: "span[class*='offerCardLabel']"
    attr: "text"
  listing_url:
    # Matches both .cz and .com URL paths
    selector: "a[href*='/properties-flats-houses'], a[href*='/nemovitosti-byty-domy']"
    attr: "href"
  image_url:
    selector: "div[class*='propertyCardImageHolder'] img"
    attr: "src"

# Selectors on the detail page
detail_fields:
  description:
    # Description block — stable fragment 'offerDetailDescription' or 'OfferDetail'
    selector: "div[class*='offerDetail'], div[class*='OfferDetail'], div[class*='description']"
    attr: "text"
  external_id:
    # Numeric ID extracted from URL path:
    # /properties-flats-houses/32696-... or /nemovitosti-byty-domy/32696-...
    # Parsed in post-processing via regex (\d+) after path segment.
    selector: ""
    attr: ""

transforms:
  strip_query_params_from_url: true
  absolutize_urls: true
  clean_whitespace: true

filters:
  required_fields:
    - "title"
    - "listing_url"
  exclude_keywords: []

rate_limit:
  min_delay_ms: 1500
  max_delay_ms: 3000

browser:
  headless: true
  use_persistent_context: false
  storage_state_path: ""

notes: |
  Bezrealitky is a Next.js SPA. CSS class names contain hashed suffixes (e.g.
  `OfferCardofferCardLabelXxYy`), so selectors use `[class*='...']`
  attribute matching on the stable camelCase fragment.

  Key structural facts from live HTML snapshot (2026-05-31):
    - Each listing card: <article class="propertyCard ..."> — stable.
    - The .cz domain uses /nemovitosti-byty-domy/<id>-<slug> paths.
    - The .com domain (English) uses /properties-flats-houses/<id>-<slug> paths.
    - Numeric listing ID is the first segment after the path prefix.
    - Price block: amount + optional additional charges + per-m² figure.
    - Pagination: ?page=N query param.
    - Card label class: offerCardLabel (not propertyCardLabel as previously assumed).
